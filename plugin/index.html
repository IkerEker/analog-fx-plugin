<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Analog FX</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <div class="logo"><div class="logo-dot"></div></div>
        <div class="brand-text">
          <div class="brand-name">ANALOG <span class="g">FX</span></div>
          <div class="brand-sub" id="layerName">Sin capa seleccionada</div>
        </div>
      </div>
      <div class="badge" id="modeBadge">v0.1</div>
    </header>

    <div id="scroll">
      <div class="row-wrap">
        <!-- Vista previa -->
        <section class="card preview-card">
          <div class="preview" id="previewBox">
            <img id="previewImg" alt="">
            <div class="preview-empty" id="previewEmpty">
              <div class="empty-icon">T</div>
              <div>Selecciona una capa de <b>texto</b>, <b>forma</b> o <b>línea</b></div>
            </div>
            <div class="preview-busy" id="previewBusy"></div>
          </div>
          <div class="preview-bar">
            <div class="pill" id="compareBtn">Mantén para ver original</div>
            <div class="seed" id="seedLabel">Semilla 1</div>
          </div>
        </section>

        <!-- Estilos + textura -->
        <div class="col">
          <section class="card">
            <div class="card-title">Estilos</div>
            <div class="chips" id="presetChips"></div>
          </section>
          <section class="card">
            <div class="card-title">Textura</div>
            <div class="thumbs" id="thumbs"></div>
            <div id="globalCtrls"></div>
          </section>
        </div>
      </div>

      <div class="mods" id="modules"></div>

      <section class="card">
        <div class="card-title">Salida</div>
        <div id="outCtrls"></div>
        <div class="ctl-label sub">Color de la tinta</div>
        <div class="chips" id="colorChips"></div>
      </section>
      <div class="foot-note">El original se conserva oculto debajo. Si seleccionas el resultado y vuelves a aplicar, se regenera desde el original.</div>
    </div>

    <footer class="bottom">
      <div class="status" id="status"></div>
      <div class="actions">
        <div class="btn icon" id="btnSeed" title="Variar (nueva semilla)">
          <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="5" cy="5" r="1.2" fill="currentColor"/><circle cx="11" cy="11" r="1.2" fill="currentColor"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/></svg>
        </div>
        <div class="btn icon" id="btnReset" title="Restablecer estilo">
          <svg width="16" height="16" viewBox="0 0 16 16"><path d="M3.2 6.2A5 5 0 1 1 3 9.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M2.6 2.8v3.6h3.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="btn primary" id="btnApply">Aplicar</div>
      </div>
    </footer>
  </div>

  <script src="js/engine.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
